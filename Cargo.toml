[package]
name = "quinn-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Rust API client for file-based Bruno collections"
license = "MIT"

[lib]
name = "quinn_api"

[[bin]]
name = "quinn"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
percent-encoding = "2.3"
reqwest = { version = "0.13.5", features = ["blocking", "cookies", "form", "gzip", "json", "query"] }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
