name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust code
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test desktop and shared engine
        run: cargo test --locked --all-features
      - name: Test CLI without desktop features
        run: cargo test --locked --no-default-features
      - name: Build native executable
        run: cargo build --locked --release
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: quinn-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/quinn
            target/release/quinn.exe
          if-no-files-found: error
